server.port=8082

# Base H2 en memoire propre au service
spring.datasource.url=jdbc:h2:mem:approvisionnementdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Jeu de donnees initial
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql

# --- V4 : OpenFeign (appels vers service-inventaire et service-alertes) ---
# Delais en millisecondes : au-dela, l'appel echoue et le service repond 503 (creation) ou degrade la consultation
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
spring.cloud.openfeign.client.config.default.logger-level=basic
logging.level.com.stockalert.approvisionnement.client=DEBUG
# Contournement d'Eureka pour des tests locaux (laisser vide en fonctionnement normal) :
# clients.inventaire.url=http://localhost:8081
# clients.alertes.url=http://localhost:8083

# --- V5 : RabbitMQ (producteur des evenements de notification) ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=stockalert
spring.rabbitmq.password=stockalert
# Delai de connexion court : un RabbitMQ arrete ne doit pas bloquer le thread de publication
spring.rabbitmq.connection-timeout=2000
logging.level.com.stockalert.approvisionnement.messaging=INFO



# ======================================
# JALON V6 - RESILIENCE4J
# ======================================

# Ordre des protections
resilience4j.retry.retry-aspect-order=1
resilience4j.circuitbreaker.circuit-breaker-aspect-order=2

# RETRY INVENTAIRE
resilience4j.retry.instances.inventaire.max-attempts=3
resilience4j.retry.instances.inventaire.wait-duration=500ms
resilience4j.retry.instances.inventaire.retry-exceptions=com.stockalert.approvisionnement.exception.ServiceDistantIndisponibleException

# RETRY ALERTES
resilience4j.retry.instances.alertes.max-attempts=3
resilience4j.retry.instances.alertes.wait-duration=500ms
resilience4j.retry.instances.alertes.retry-exceptions=com.stockalert.approvisionnement.exception.ServiceDistantIndisponibleException

# CIRCUIT BREAKER INVENTAIRE
resilience4j.circuitbreaker.instances.inventaire.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventaire.sliding-window-size=6
resilience4j.circuitbreaker.instances.inventaire.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.inventaire.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventaire.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventaire.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventaire.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.inventaire.ignore-exceptions=com.stockalert.approvisionnement.exception.RessourceDistanteIntrouvableException,com.stockalert.approvisionnement.exception.ReponseDistanteInattendueException

# CIRCUIT BREAKER ALERTES
resilience4j.circuitbreaker.instances.alertes.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.alertes.sliding-window-size=6
resilience4j.circuitbreaker.instances.alertes.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.alertes.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.alertes.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.alertes.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.alertes.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.alertes.ignore-exceptions=com.stockalert.approvisionnement.exception.RessourceDistanteIntrouvableException,com.stockalert.approvisionnement.exception.ReponseDistanteInattendueException
