server.port=8084

# Base H2 en memoire propre au service (historique des emails envoyes)
spring.datasource.url=jdbc:h2:mem:notificationdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# --- V5 : RabbitMQ (consommateur) ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=stockalert
spring.rabbitmq.password=stockalert
# Un message a la fois (traitement ordonne, email par email)
spring.rabbitmq.listener.simple.prefetch=1
# Echec (ex. SMTP arrete) : 4 essais espaces de 1 s, 2 s, 4 s, puis rejet sans remise en file -> DLQ
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- V5 : SMTP (Mailpit : SMTP 1025, interface web 8025) ---
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
notification.expediteur=stock-alert@stockalert.local

# L'indicateur de sante "mail" tente une connexion SMTP : on le desactive pour ne pas rendre le service "DOWN" si Mailpit est arrete
management.health.mail.enabled=false
