# Option 2 : routage statique -> lancer avec le profil "statique"
# (spring.profiles.active=statique ou VM option -Dspring.profiles.active=statique)
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=service-inventaire
spring.cloud.gateway.server.webflux.routes[0].uri=lb://service-inventaire
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/products/**,/stock-levels/**

spring.cloud.gateway.server.webflux.routes[1].id=service-approvisionnement
spring.cloud.gateway.server.webflux.routes[1].uri=lb://service-approvisionnement
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/suppliers/**,/purchase-orders/**

spring.cloud.gateway.server.webflux.routes[2].id=service-alertes
spring.cloud.gateway.server.webflux.routes[2].uri=lb://service-alertes
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/thresholds/**,/stock-alerts/**

spring.cloud.gateway.server.webflux.routes[3].id=service-notification
spring.cloud.gateway.server.webflux.routes[3].uri=lb://service-notification
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/notifications/**
