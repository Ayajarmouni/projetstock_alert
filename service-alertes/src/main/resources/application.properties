spring.application.name=service-alertes
server.port=8083

# Base H2 en mémoire propre au service (chaque service gère ses données)
spring.datasource.url=jdbc:h2:mem:alertesdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Jeu de données initial
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql

# Actuator + Swagger UI (/swagger-ui/index.html)
management.endpoints.web.exposure.include=health,info

# Enregistrement aupres du registre Eureka (TP1 / jalon V2)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
